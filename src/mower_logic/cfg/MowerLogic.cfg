gen.add("undocking_waiting_time", double_t, 0, "Time to wait (s) before undocking", 0, 0, 60)
gen.add("perimeter_signal",int_t, 0, "Which perimeter signal should be used? 0-None, positive number gives signal number and uses counterclockwise docking, negative numbers use clockwise docking", 0, -2, 2)
gen.add("outline_count", int_t, 0, "Outline count to mow before filling", 3, 0, 255)
gen.add("outline_overlap_count", int_t, 0, "Outlines to overlap with fill", 0, 0, 255)
gen.add("outline_offset", double_t, 0, "Additional outer outline offset, use positive values for safety, negative values to enlarge the area", 0.0, -1.0, 1.0)
gen.add("outline_simplify_per_loop", double_t, 0, "Progressive Douglas-Peucker simplification per area outline after the outermost outline; 0 disables simplification (m)", 0.0, 0.0, 0.25)
gen.add("outline_simplify_max_tolerance", double_t, 0, "Maximum Douglas-Peucker simplification tolerance for area outlines (m)", 0.05, 0.0, 0.50)
gen.add("outline_simplify_safety_factor", double_t, 0, "Safety overlap factor: effective outline spacing is reduced by factor * simplification tolerance", 2.0, 0.0, 5.0)
gen.add("outline_simplify_min_distance_factor", double_t, 0, "Minimum simplified outline spacing as factor of tool_width", 0.5, 0.1, 1.0)
gen.add("outline_simplify_affects_next_offset", bool_t, 0, "Use the simplified area outline as basis for the next outline", True)
gen.add("obstacle_outline_count", int_t, 0, "Obstacle/inner outline count (-1 = same as outline_count)", -1, -1, 255)
gen.add("obstacle_outline_overlap_count", int_t, 0, "Obstacle/inner outline overlap (-1 = same as outline_overlap_count)", -1, -1, 255)
gen.add("mow_angle_offset", double_t, 0, "Mowing angle offset", 0, -180, 180)
gen.add("mow_angle_offset_is_absolute", bool_t, 0, "If true then the offset is relative to East, if false then the offset is relative to the auto-detected angle.", False)
gen.add("mow_angle_increment", double_t, 0, "Mowing angle automatic increment. Will be added to the offset every time the entire map is finished", 0, 0, 180)
gen.add("tool_width", double_t, 0, "Width of the mower", 0.14, 0.1, 2)
gen.add("enable_mower", bool_t, 0, "True to enable mow motor", False)
gen.add("mow_motor_direction_mode", int_t, 0, "Mow motor direction mode: -1 fixed reverse/left, 0 alternate on each start, 1 fixed forward/right", 0, -1, 1)
gen.add("manual_pause_mowing", bool_t, 0, "True to disable mowing automatically", False)
gen.add("motor_hot_temperature", double_t, 0, "Motor temperature to pause mowing", 70.0, 20.0, 150.0)
gen.add("motor_cold_temperature", double_t, 0, "Motor temperature to allow mowing", 40.0, 20.0, 150.0)
gen.add("mow_load_factor_enabled", bool_t, 0, "Use calculated mowing load factor instead of a fixed factor of 1.0", False)
gen.add("mow_load_factor_min", double_t, 0, "Minimum mowing load factor", 0.40, 0.10, 1.00)
gen.add("mow_load_current_start", double_t, 0, "Mow motor current where load derating starts", 0.75, 0.0, 100.0)
gen.add("mow_load_current_end", double_t, 0, "Mow motor current where the minimum load factor is reached", 1.25, 0.0, 100.0)
gen.add("mow_load_motor_temp_start", double_t, 0, "Mow motor temperature where load derating starts", 55.0, 0.0, 150.0)
gen.add("mow_load_motor_temp_end", double_t, 0, "Mow motor temperature where the minimum load factor is reached", 68.0, 0.0, 150.0)
gen.add("mow_load_esc_temp_start", double_t, 0, "Mow ESC temperature where load derating starts", 60.0, 0.0, 150.0)
gen.add("mow_load_esc_temp_end", double_t, 0, "Mow ESC temperature where the minimum load factor is reached", 78.0, 0.0, 150.0)
gen.add("mow_load_factor_smoothing_enabled", bool_t, 0, "Smooth calculated mowing load factor with an asymmetric low-pass filter", True)
gen.add("mow_load_factor_smoothing_down_alpha", double_t, 0, "Asymmetric load factor low-pass alpha when the factor decreases; higher reacts faster to load", 0.50, 0.0, 1.0)
gen.add("mow_load_factor_smoothing_up_alpha", double_t, 0, "Asymmetric load factor low-pass alpha when the factor increases; lower recovers more slowly", 0.10, 0.0, 1.0)
gen.add("mow_load_status_publish_period", double_t, 0, "Minimum period in seconds between mowing load factor JSON status publications", 0.50, 0.05, 60.0)
gen.add("max_position_accuracy", double_t, 0, "We allow driving as long as our position is better than this value (m)", 0.2, 0.01, 1.0)
gen.add("gps_wait_time", double_t, 0, "Time to wait after good GPS fix", 10.0, 0.0, 60.0)
gen.add("gps_timeout", double_t, 0, "Time to allow driving without valid GPS", 10.0, 0.0, 60.0)
gen.add("add_fake_obstacle", bool_t, 0, "True to add a fake obstacle to hopefully help path approach", False)
gen.add("ignore_gps_errors", bool_t, 0, "True to ignore gps errors. USE ONLY FOR SIMULATION!", False)
gen.add("max_first_point_attempts", int_t, 0, "Maximum attempts to reach the first point of the mow path before trimming", 3, 1, 10)
gen.add("max_first_point_trim_attempts", int_t, 0, "After <max_first_point_attempts> we start to trim the path beginning this often", 3, 1, 10)
gen.add("rain_mode", int_t, 0, "0 - Ignore, 1 - Dock, 2 - Dock until dry, 3 - Pause Automatic Mode", 0, 0, 3)
gen.add("rain_delay_minutes", int_t, 0, "Time to wait after rain to resume mowing", 1, 30, 1440)
gen.add("rain_check_seconds", int_t, 0, "Rain must be detected continuosly for this time to trigger rain_mode", 0, 20, 300)
gen.add("cu_rain_threshold", int_t, 0, "Stock-CoverUI limited rain sensor threshold, below which humidity/dryness value get identified as rain. As higher, as more dry. Default to 700", -1)
gen.add("emergency_lift_period", int_t, 0, "Period (ms) for multiple wheels/halls to be lifted/triggered in order to count as emergency. This is to filter uneven ground", -1)
gen.add("emergency_tilt_period", int_t, 0, "Period (ms) for a single wheel/hall to be lifted/triggered in order to count as emergency. This is to filter uneven ground", -1)
gen.add("emergency_input_config", str_t, 0, "Comma separated list of emergency inputs (halls or stop), where each sensor can be configured in one of the following modes '[!]<I>gnore|<U>nused|<S>top|<L>Lift'", "")
gen.add("shutdown_esc_max_pitch", int_t, 0, "Maximum pitch angle (deg) where ESC shutdown is permitted (0 to disable ESC shutdown)", 0, 0, 180)


# GPS logging remains an internal mower_logic configuration because the
# cycle-aware controller needs mower state information. xbot_monitoring exposes
# the public app/MQTT contract exclusively below gps_state/logging and maps the
# public gps_state settings to these internal dynamic_reconfigure fields.
# Runtime start/stop is command-only; no compatibility enable toggle exists.
# The script only records and flushes files.
gen.add("satellite_logging_default_trigger", str_t, 0, "Satellite logging default trigger: next_cycle, ad_hoc, area_id", "next_cycle")
gen.add("satellite_logging_default_mode", str_t, 0, "Satellite logging default mode: from_start_to_docking, from_docking_to_docking, until_docking", "from_start_to_docking")
gen.add("satellite_logging_default_area_id", str_t, 0, "Satellite logging target area id for area_id trigger", "")
gen.add("satellite_logging_script_path", str_t, 0, "Satellite logging script path", "/home/openmower/scripts/record_satellites.sh")
gen.add("satellite_logging_ram_path", str_t, 0, "Satellite logging RAM directory", "/dev/shm/openmower_satellite_logs")
gen.add("satellite_logging_output_path", str_t, 0, "Satellite logging persistent output directory", "/home/openmower/recordings/logs")
gen.add("satellite_logging_container_name", str_t, 0, "Optional ROS container name for satellite logging script. Leave empty for auto-detection", "")

# Optional mowing path order optimizer. Defaults are intentionally conservative:
# the optimizer is installed as a pass-through stage until explicitly enabled.
gen.add("path_order_optimizer_enabled", bool_t, 0, "Enable optional mowing path order optimizer between slicer and mowing execution", False)
gen.add("path_order_optimizer_processing_mode", int_t, 0, "POO processing mode: 1 slicer_order, 2 ordered_fills_plus_ordered_obstacles, 3 ordered_obstacles_plus_ordered_fills, 4 mixed_fills_and_obstacles", 2, 1, 4)
gen.add("path_order_optimizer_outline_entry_mode", int_t, 0, "POO outline entry mode: 0 slicer_entry, 1 approach_outer_outline_entry", 1, 0, 1)
gen.add("path_order_optimizer_allow_reverse", bool_t, 0, "Allow reversing fill paths when their end point is cheaper to reach", True)
gen.add("path_order_optimizer_cost_mode", int_t, 0, "Path order optimizer cost mode: 0 euclidean, 1 planner, 2 hybrid", 2, 0, 2)
gen.add("path_order_optimizer_max_fill_paths", int_t, 0, "Maximum fill paths for full optimization, 0 disables the limit", 150, 0, 2000)
gen.add("path_order_optimizer_candidate_limit", int_t, 0, "Number of nearest candidates checked with planner in planner/hybrid mode", 5, 1, 50)
gen.add("path_order_optimizer_planner_timeout", double_t, 0, "Timeout in seconds while waiting for planner service availability", 0.25, 0.05, 5.0)
gen.add("path_order_optimizer_fallback_to_euclidean", bool_t, 0, "Fallback to euclidean cost if planner cost request fails", True)
gen.add("path_order_optimizer_fallback_to_slicer_order", bool_t, 0, "Fallback to original slicer order if optimization fails", True)
gen.add("path_order_optimizer_fail_open", bool_t, 0, "Continue with original slicer paths if optimizer service is unavailable or fails", True)
gen.add("path_order_optimizer_planner_action", str_t, 0, "MBF GetPath action used for path-order costs", "/move_base_flex/get_path")
gen.add("path_order_optimizer_planner_name", str_t, 0, "MBF planner name used for path-order costs", "GlobalPlanner")

exit(gen.generate("mower_logic", "mower_logic", "MowerLogic"))
